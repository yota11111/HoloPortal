name: Post X fan digest

on:
  workflow_dispatch:
  schedule:
    - cron: "10 0 * * *"

permissions:
  contents: read

concurrency:
  group: post-x-fan-digest
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Restore fetch cache
        uses: actions/cache@v4
        with:
          path: .cache/holo-portal-fetch
          key: holo-portal-fetch-x-${{ github.run_id }}
          restore-keys: |
            holo-portal-fetch-

      - name: Fetch latest data
        run: npm run fetch:data
        env:
          HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}

      - name: Post fan-friendly X digest
        run: npm run post:x
        env:
          SITE_URL: https://holo-portal.com
          X_POST_ENABLED: ${{ secrets.X_POST_ENABLED }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
